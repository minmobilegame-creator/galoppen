<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14102a" />
    <title>Galoppen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside id="board" aria-label="Scoretavle">
        <header class="board-head">
          <h1>Galoppen</h1>
          <div class="clock">
            <div><span class="label">Tid</span><span id="time" class="value">0:00.0</span></div>
            <div><span class="label">Bedste</span><span id="best" class="value">–</span></div>
          </div>
          <div class="buttons">
            <button id="startBtn" class="btn primary" type="button">Start</button>
            <button id="resetBtn" class="btn" type="button" title="Nyt spil">Nyt spil</button>
            <button id="mpBtn" class="btn" type="button">Multiplayer</button>
          </div>
          <div id="roomBadge" class="room-badge" hidden></div>
        </header>
        <div class="race">
          <ol id="lanes" class="lanes"></ol>
          <canvas id="horses" aria-hidden="true"></canvas>
        </div>
        <p class="hint" id="hint">
          Hold venstre museknap nede på en kugle, før hånden opad og slip for at kaste. Første til
          <b>20 point</b> vinder.
        </p>
        <section class="top10" aria-labelledby="top10Title">
          <h3 id="top10Title">Top 10 · hurtigste vindere</h3>
          <ol id="top10"><li class="muted">Henter …</li></ol>
        </section>
      </aside>
      <main id="stage">
        <canvas id="scene" aria-label="Spillebordet"></canvas>
        <div id="popups"></div>
        <div id="loading">Stiller bordet op …</div>
      </main>
    </div>
    <div id="winner" class="modal" hidden>
      <div class="card">
        <div class="trophy" aria-hidden="true">🏆</div>
        <h2 id="winnerTitle"></h2>
        <p id="winnerText"></p>
        <button id="againBtn" class="btn primary" type="button">Spil igen</button>
      </div>
    </div>
    <div id="lobby" class="modal" hidden>
      <div class="card lobby-card" role="dialog" aria-modal="true" aria-label="Multiplayer-lobby">
        <button class="close" type="button" data-act="close" aria-label="Luk">×</button>
        <div class="lobby-body"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
